apiVersion: apps/v1
kind: Deployment
metadata:
  name: appeduv2pwa
  namespace: production
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: appeduv2pwa
  template:
    metadata:
      labels:
        app: appeduv2pwa
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: appeduv2pwa
          image: harbor.emso.vn/emso-common/appeduv2pwa:0.0.3
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          envFrom:
            - configMapRef:
                name: appeduv2pwa-config
          ports:
            - name: http
              containerPort: 3000
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
      imagePullSecrets:
        - name: emso-harbo-production
